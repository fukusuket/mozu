/* The page fills the window and the list takes the height left, so the filters cost no rows below it. */
body { box-sizing: border-box; height: 100vh; height: 100dvh; display: flex; flex-direction: column; margin: 0 auto; max-width: 1400px; padding: 16px; font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }

h1 { font-size: 1.2em; margin: 0; color: var(--accent); }
#app, .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; } .screen { overflow: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: var(--head); position: sticky; top: 0; }
pre { font-family: ui-monospace, monospace; word-break: break-all; }
pre { white-space: pre-wrap; margin: 4px 0; }
.level { font-weight: 600; text-transform: uppercase; white-space: nowrap; }
.level-critical { color: #b00020; } .level-high { color: #c45100; }
.state { color: var(--muted); } .state-deleted { color: #b00020; font-weight: 600; }
.muted, footer { color: var(--muted); }
footer { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 4px; font-size: 0.85em; } footer p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 8px 0; }
.tab { border-bottom: none; border-radius: 4px 4px 0 0; padding: 6px 14px; }
.tab.selected { background: var(--head); font-weight: 600; box-shadow: inset 0 -2px var(--accent); }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 8px; }
.filters input, .filters select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
.filters input.invalid { border-color: #b00020; }
.count { font-weight: 600; }
.filters input.filter-q { width: 24em; } .filters input.filter-from, .filters input.filter-to { width: 24ch; }
[data-screen="findings"] { --cols: 7em 5em 17em minmax(12em, 1fr) 8em minmax(10em, 18em); }
[data-screen="outside"] { --cols: 17em 5em minmax(12em, 1fr); }
.list-head, .line { display: grid; grid-template-columns: var(--cols); gap: 8px; }
.list-head { background: var(--head); font-weight: 600; padding: 4px 8px; }
.viewport { flex: 1 0 10em; overflow: auto; border: 1px solid var(--line); }
.spacer { position: relative; } .block { position: absolute; left: 0; right: 0; }
.row { box-sizing: border-box; overflow: hidden; padding: 2px 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row.selected { background: var(--head); }
.line span, .facts { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* A long path loses its start, not its file name: the cell runs right to left, the text inside left to right. */
.line .path { direction: rtl; text-align: left; } .line .path > span { direction: ltr; unicode-bidi: isolate; }
.facts { font-size: 0.85em; color: var(--muted); }
.detail { flex: none; max-height: 30vh; overflow: auto; margin-top: 8px; border: 1px solid var(--line); padding: 8px; }
.mono, .path { font-family: ui-monospace, monospace; }
